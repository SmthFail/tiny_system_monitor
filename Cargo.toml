[package]
name = "system_monitor"
version = "0.3.9"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
crossterm = "0.26.1"
sysinfo = {version = "0.36.1", default-features = true}
nvml-wrapper = "0.11.0"
unicode-width = "0.1"
once_cell = "1.18"
minreq = {version = "2.13.4", features = ["https"] }

[[bin]]
name = "tsm"
path = "src/main.rs"
